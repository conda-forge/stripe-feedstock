# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "17.0.0"
  python_check_max: "3.15"

package:
  name: stripe
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stripe/stripe-${{ version }}.tar.gz
  sha256: 5e1bdde6eac0311f6c3dea60457e3e49091789785db9c90d28d75a0398835589

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}
    - requests >=2.20
    - typing_extensions >=4.7.0

tests:
  - package_contents:
      strict: true
      site_packages:
        - stripe/**
        - stripe-${{ version }}.dist-info/**
  - python:
      imports: stripe
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*

about:
  summary: Python bindings for the Stripe API
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/stripe
  repository: https://github.com/stripe/stripe-python

extra:
  recipe-maintainers:
    - bollwyvl
